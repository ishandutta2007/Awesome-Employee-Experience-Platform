<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bg)" />
  
  <!-- Dynamic / Animated Background Wave Elements (Background Layer) -->
  <g opacity="0.25">
    <path d="M-100,250 Q200,100 500,220 T1100,150 T1300,300 L1300,400 L-100,400 Z" fill="url(#accent)">
      <animate attributeName="d" 
        dur="12s" 
        repeatCount="indefinite"
        values="
          M-100,250 Q200,100 500,220 T1100,150 T1300,300 L1300,400 L-100,400 Z;
          M-100,220 Q250,180 550,140 T1050,220 T1300,250 L1300,400 L-100,400 Z;
          M-100,250 Q200,100 500,220 T1100,150 T1300,300 L1300,400 L-100,400 Z" />
    </path>
    <path d="M-100,290 Q300,200 700,280 T1300,200 L1300,400 L-100,400 Z" fill="#6366f1" opacity="0.5">
      <animate attributeName="d" 
        dur="16s" 
        repeatCount="indefinite"
        values="
          M-100,290 Q300,200 700,280 T1300,200 L1300,400 L-100,400 Z;
          M-100,260 Q350,240 650,200 T1300,270 L1300,400 L-100,400 Z;
          M-100,290 Q300,200 700,280 T1300,200 L1300,400 L-100,400 Z" />
    </path>
  </g>

  <!-- Decorative Orbit Dots -->
  <circle cx="950" cy="100" r="4" fill="#a855f7">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="150" cy="280" r="6" fill="#38bdf8">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="1080" cy="270" r="5" fill="#f472b6">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
  </circle>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(600, 145)" text-anchor="middle">
    <!-- Icon/Badge Top -->
    <rect x="-140" y="-85" width="280" height="36" rx="18" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" />
    <text x="0" y="-62" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">🚀 CURATED ECOSYSTEM</text>
    
    <!-- Title -->
    <text x="0" y="5" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">Awesome Employee Experience</text>
    <text x="0" y="50" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="0.5">Platform Ecosystem</text>
    
    <!-- Subtitle -->
    <text x="0" y="95" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      Enterprise SaaS &amp; Open-Source Tools for Engagement, Recognition, OKRs &amp; People Analytics
    </text>
  </g>
</svg>
